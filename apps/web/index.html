<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#181A17" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Tema antes del primer pintado (sin parpadeo): preferencia guardada o, si no hay, la del sistema.
      // Misma clave y colores que src/app/tema.ts.
      (function () {
        var m = null;
        try {
          m = localStorage.getItem('gold2-modo');
        } catch (e) {}
        if (m !== 'claro' && m !== 'oscuro') m = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
        var r = document.documentElement;
        r.setAttribute('data-modo', m);
        r.style.colorScheme = m === 'claro' ? 'light' : 'dark';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', m === 'claro' ? '#f3f0e4' : '#181a17');
      })();
    </script>
    <meta name="description" content="Plataforma comunitaria y científica frente al mercurio de la minería aurífera en Bolivia: mapa comunitario, laboratorio satelital, educación y donaciones trazables." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Gold2Life · El lado invisible del oro</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta plataforma necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
